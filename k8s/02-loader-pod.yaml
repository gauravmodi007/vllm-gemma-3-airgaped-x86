apiVersion: v1
kind: Pod
metadata:
  name: gemma-model-loader
  namespace: vllm-gemma-3-x86
spec:
  # NOTE: the PVC is ReadWriteOnce. On multi-node clusters scale the vLLM deployment to 0 before using this pod.
  containers:
  - name: loader
    image: alpine:latest
    command: ["/bin/sh", "-c", "sleep infinity"]
    volumeMounts:
    - name: model-cache
      mountPath: /models-cache
  volumes:
  - name: model-cache
    persistentVolumeClaim:
      claimName: gemma-model-pvc
